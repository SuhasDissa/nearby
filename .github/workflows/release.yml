name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release readiness
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      # The PKGBUILD's pkgver is the only place the project records a version.
      - name: Check tag matches the Arch package version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkgver="$(grep -oP '^pkgver=\K.*' sharing/linux/app/packaging/arch/PKGBUILD)"
          if [ "${tag_version}" != "${pkgver}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match PKGBUILD pkgver=${pkgver}"
            exit 1
          fi
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: verify
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    secrets: inherit

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [verify, package]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF2'
          ## Installing

          - **AppImage** (needs glibc 2.39 or newer): `chmod +x QuickShare-*.AppImage && ./QuickShare-*.AppImage`
          - **Arch Linux**: `sudo pacman -U quickshare-*.pkg.tar.zst`
          - **Flatpak**: requires `flatpak` with the Flathub remote added (`flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo`), then `flatpak install --user QuickShare-*.flatpak`
          EOF2
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "QuickShare ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/linux-appimage/*.AppImage \
            dist/arch-package/*.pkg.tar.zst \
            dist/flatpak-bundle/*.flatpak
